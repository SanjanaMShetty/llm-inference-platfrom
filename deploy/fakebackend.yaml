apiVersion: v1
kind: Namespace
metadata:
  name: llm-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakebackend
  namespace: llm-platform
  labels:
    app.kubernetes.io/name: fakebackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fakebackend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fakebackend
    spec:
      containers:
        - name: fakebackend
          image: fakebackend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Keep these in sync with the expectations in hack/smoke.sh.
            - name: FAKE_FIRST_TOKEN_DELAY
              value: "500ms"
            - name: FAKE_TOKENS_PER_SECOND
              value: "50"
            - name: FAKE_MAX_CONCURRENCY
              value: "8"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: fakebackend
  namespace: llm-platform
  labels:
    app.kubernetes.io/name: fakebackend
spec:
  selector:
    app.kubernetes.io/name: fakebackend
  ports:
    - name: http
      port: 80
      targetPort: http
