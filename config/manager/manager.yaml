apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-platform-operator
  namespace: llm-platform-system
  labels:
    app.kubernetes.io/name: llm-platform-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-platform-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-platform-operator
    spec:
      serviceAccountName: llm-platform-operator
      containers:
        - name: operator
          image: llm-platform-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
